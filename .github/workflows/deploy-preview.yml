name: Deploy PR preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: deploy-preview
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    environment:
      name: development
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      PREVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Resolve the open PR for the verified commit
        id: pr
        run: |
          number=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" |
            jq -r --arg sha "$VERIFIED_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '[.[][] | select(.head.sha == $sha and .head.repo.full_name == $repo)][0].number // empty')
          test "$number" != ""
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"

      - name: Check out trusted deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install trusted deployment tools
        run: pnpm install --frozen-lockfile

      - name: Download verified static export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-assets
          path: out/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate preview files
        run: |
          test -s out/index.html
          if find out -type l | grep -q .; then
            echo 'Preview assets must not contain symlinks.' >&2
            exit 1
          fi

      - name: Recheck that this commit is still the open PR head
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -e --arg sha "$VERIFIED_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo'

      - name: Register commit-specific preview deployment
        id: preview_deployment
        run: node scripts/preview-deployment.mjs start

      - name: Resolve installed Wrangler version
        id: wrangler
        run: |
          version=$(node -p "require('./node_modules/wrangler/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated PR preview to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name agentic-webapp-pr-${{ steps.pr.outputs.number }}
          packageManager: pnpm
          wranglerVersion: ${{ steps.wrangler.outputs.version }}

      - name: Smoke test and report preview
        env:
          DEV_URL: ${{ steps.deploy.outputs['deployment-url'] }}
        run: |
          pnpm test:smoke:dev
          echo "PR #${PR_NUMBER} preview: ${DEV_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Chromium for preview browser test
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify persisted theme in PR preview
        env:
          DEV_URL: ${{ steps.deploy.outputs['deployment-url'] }}
        run: pnpm exec playwright test tests/e2e/theme.spec.ts

      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-browser-trace-${{ steps.pr.outputs.number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish verified preview deployment status
        if: always() && steps.preview_deployment.outputs.id != ''
        env:
          PREVIEW_DEPLOYMENT_ID: ${{ steps.preview_deployment.outputs.id }}
          PREVIEW_RESULT: ${{ job.status }}
          DEV_URL: ${{ steps.deploy.outputs['deployment-url'] }}
        run: node scripts/preview-deployment.mjs finish
