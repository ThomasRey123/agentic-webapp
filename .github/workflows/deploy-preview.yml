name: Deploy PR preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: deploy-preview
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve the open PR for the verified commit
        id: pr
        run: |
          number=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" |
            jq -r --arg sha "$VERIFIED_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '[.[][] | select(.head.sha == $sha and .head.repo.full_name == $repo)][0].number // empty')
          test "$number" != ""
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"

      - name: Check out trusted deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install trusted deployment tools
        run: pnpm install --frozen-lockfile

      - name: Download verified static export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-assets
          path: out/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate preview files
        run: |
          test -s out/index.html
          if find out -type l | grep -q .; then
            echo 'Preview assets must not contain symlinks.' >&2
            exit 1
          fi

      - name: Recheck that this commit is still the open PR head
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -e --arg sha "$VERIFIED_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo'

      - name: Deploy isolated PR preview to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name agentic-webapp-pr-${{ steps.pr.outputs.number }}
          packageManager: pnpm
          wranglerVersion: "4.131.2"

      - name: Smoke test and report preview
        env:
          DEV_URL: ${{ steps.deploy.outputs['deployment-url'] }}
        run: |
          pnpm test:smoke:dev
          echo "PR #${PR_NUMBER} preview: ${DEV_URL}" >> "$GITHUB_STEP_SUMMARY"
