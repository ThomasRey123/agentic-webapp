name: Feature request
description: Define a scoped, observable change to the application or delivery system.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form as the scoped task record. New or changed intended behavior needs a spec-only PR and owner approval before implementation. See docs/development/spec-driven-development.md.

  - type: dropdown
    id: task-route
    attributes:
      label: SDD task route
      options:
        - Specification proposal
        - Implementation of approved specification
        - Behavior-preserving maintenance
    validations:
      required: true

  - type: textarea
    id: specification-contract
    attributes:
      label: Specification or maintenance contract
      description: For a proposal, give the intended spec path and open questions. For implementation, give spec path, owner-merged spec PR, full merge SHA and requirement IDs. For maintenance, explain unchanged behavior, spec or legacy evidence, and verification. Approval cannot be self-declared.
      placeholder: |
        Spec proposal: docs/specs/<feature>/spec.md; unresolved questions...
        Implementation: spec path; approved PR URL; full merge SHA; FR-001...
        Maintenance: no intended behavior change because...; evidence...; checks...
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this change produce, and for whom?
      placeholder: Users can...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List concrete, verifiable conditions for completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what must not be implemented as part of this issue. Write "None" if there are no exclusions.
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation notes
      description: Add relevant constraints, dependencies, links, or migration considerations.

  - type: checkboxes
    id: readiness
    attributes:
      label: Task readiness
      options:
        - label: The goal is specific enough to implement without inventing product scope.
          required: true
        - label: The acceptance criteria describe observable outcomes.
          required: true
